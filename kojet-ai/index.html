<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 1. Meta Tags Standar -->
    <title>Kojet AI | Asisten Cerdas Mahasiswa</title>
    <meta
      name="description"
      content="Kojet AI siap bantu kerjain tugas kuliah, makalah, sampe error kodingan. Creator: @faajharr_"
    />

    <!-- 2. Meta Tags Khusus WhatsApp & Facebook (Open Graph) -->
    <meta property="og:type" content="website" />

    <!-- WAJIB GANTI: URL website kamu setelah di-hosting (harus pakai https://) -->
    <meta property="og:url" content="https://kojet-ai.vercel.app/" />

    <meta property="og:title" content="Kojet AI | Asisten Cerdas Mahasiswa" />
    <meta
      property="og:description"
      content="Nugas makin gampang bareng Kojet AI. Siap bantu bikin makalah, PPT, sampe kodingan. Langsung gas cobain!"
    />

    <!-- WAJIB GANTI: URL Gambar lengkap dengan https:// -->
    <!-- PERHATIAN: Ukuran file gambar wajib di bawah 300KB untuk WhatsApp! -->
    <meta
      property="og:image"
      itemprop="image"
      content="https://kojet-ai.vercel.app/preview.jpg"
    />

    <!-- Tambahan Khusus WhatsApp agar loading preview lebih cepat -->
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- 3. Twitter Cards (Bonus untuk Twitter/X) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kojet AI | Asisten Cerdas Mahasiswa" />
    <meta
      name="twitter:description"
      content="Nugas makin gampang bareng Kojet AI. Coba sekarang!"
    />
    <meta
      name="twitter:image"
      content="https://kojet-ai.vercel.app/preview.jpg"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
